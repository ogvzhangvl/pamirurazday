<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pamir Uraz’ın 1. Yaş Daveti</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#2c4a7c;--blue:#bcd3ee;--cream:#fbf3e2;--card:#fdf8ec;--ink:#2c4a7c;--sage:#8a9a74;--sq:#e2ecf8;--bg:#f6efe0;--shadow:rgba(44,74,124,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#a9c4ec;--blue:#3b5a8c;--cream:#1b2740;--card:#223252;--ink:#e6eefb;--sage:#a9b890;--sq:#1f3050;--bg:#17223a;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--navy:#a9c4ec;--blue:#3b5a8c;--cream:#1b2740;--card:#223252;--ink:#e6eefb;--sage:#a9b890;--sq:#1f3050;--bg:#17223a;--shadow:rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);
background-image:linear-gradient(90deg,var(--sq) 50%,transparent 50%),linear-gradient(var(--sq) 50%,transparent 50%);background-size:44px 44px;background-blend-mode:multiply;padding:24px 16px 48px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.hero{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px var(--shadow);border:5px solid var(--card)}
.hero img{display:block;width:100%;height:auto;max-width:100%}
.card{background:var(--card);border-radius:26px;padding:26px 22px;box-shadow:0 10px 30px var(--shadow);position:relative}
.card:before{content:"";position:absolute;inset:8px;border:2px dashed var(--blue);border-radius:20px;pointer-events:none}
h2{font-family:'Dancing Script',cursive,serif;font-size:2.1rem;margin:0 0 6px;text-align:center;font-weight:600}
.sub{text-align:center;margin:0 0 18px;font-size:.98rem;opacity:.85}
.heart{display:block;text-align:center;color:var(--navy);margin:0 0 10px;font-size:1.1rem}
.row{display:flex;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--blue)}
.row:first-of-type{border-top:0}
.ic{font-size:1.6rem;width:40px;text-align:center}
.row b{display:block;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.row span{font-size:1.1rem;font-weight:600}
.choices{display:grid;gap:10px;margin:6px 0 16px;position:relative;z-index:1}
.ch{font:inherit;font-weight:600;font-size:1.05rem;padding:14px;border-radius:16px;border:2px solid var(--navy);background:transparent;color:var(--ink);cursor:pointer;transition:.15s}
.ch[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 6px;position:relative;z-index:1}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--blue);background:var(--cream);color:var(--ink);position:relative;z-index:1}
textarea{resize:vertical;min-height:70px}
#guests{display:none}
.send{display:block;text-align:center;text-decoration:none;margin-top:20px;padding:15px;border-radius:999px;background:var(--navy);color:var(--cream);font-weight:600;font-size:1.05rem;position:relative;z-index:1}
.hint{text-align:center;font-size:.85rem;min-height:1.2em;margin:10px 0 0;position:relative;z-index:1}
.map{display:block;text-align:center;text-decoration:none;margin-top:10px;padding:13px;border-radius:999px;border:2px solid var(--navy);color:var(--ink);font-weight:600;position:relative;z-index:1}
.foot{text-align:center;font-family:'Dancing Script',cursive,serif;font-size:1.5rem}
</style></head><body>

<div class="choices" role="group" aria-label="Katılım durumu">

</div>

</main>
<script>
(function(){
var PHONE="";/* örn: 905321234567 */
var v="",$=function(i){return document.getElementById(i)};
var btns=document.querySelectorAll('.ch');
function upd(){
 var t="Merhaba! Pamir Uraz’ın 1 yaş doğum günü daveti için yanıtım: "+v+"."+"\nAd: "+$('name').value.trim();
 if(v==="Katılacağım")t+="\nKişi sayısı: "+$('cnt').value;
 if($('note').value.trim())t+="\nNot: "+$('note').value.trim();
 $('send').href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(t);
}
btns.forEach(function(b){b.addEventListener('click',function(){
 v=b.dataset.v;btns.forEach(function(x){x.setAttribute('aria-pressed',x===b)});
 $('guests').style.display=v==="Katılacağım"?"block":"none";$('hint').textContent="";upd();
})});
['name','cnt','note'].forEach(function(i){$(i).addEventListener('input',upd)});
$('send').addEventListener('click',function(e){
 if(!v||!$('name').value.trim()){e.preventDefault();$('hint').textContent=!v?"Lütfen bir seçenek belirle 💙":"Lütfen adını yaz 💙";return}
 upd();$('hint').textContent="Teşekkürler! WhatsApp açılıyor, mesajı göndermeyi unutma 🎉";
});
upd();
})();
</script></body></html>
